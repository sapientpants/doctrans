# Pre-commit configuration for comprehensive code quality checks
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Every external hook is pinned to a full commit SHA with the tag kept in the
# `# frozen:` comment, the form `pre-commit autoupdate --freeze` writes. A tag can
# be force-moved by anyone who can push to the hook's repository, and the next cold
# cache -- a new machine, `pre-commit clean`, a CI cache miss -- would clone and, for
# the Python and Node hooks, pip/npm-install and run whatever it then points at, as
# the developer. `scripts/check_precommit_pins.exs` fails the gate on a bare tag.
# Bump a hook with `pre-commit autoupdate --freeze` (optionally `--repo <url>`);
# never run `autoupdate` without `--freeze`, which rewrites every pin back to a
# tag. Dependabot has no pre-commit ecosystem, so bumps are by hand (or by
# pre-commit.ci's own autoupdate, if that service is enabled; the gate rejects any
# pin it leaves unfrozen). A SHA pins the hook's own source, not its transitive
# pip/npm dependencies.

default_language_version:
  python: python3
  # Pinned: nodeenv otherwise resolves "latest" to a pre-release tag such as
  # 27.0.0-alpha and crashes while parsing it, so no node hook can install.
  node: '26.13.0'

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Conventional commit message validation (scope required)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-scope, feat, fix, docs, style, refactor, test, chore, build, ci, perf, revert]

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Security and safety checks (fast)
      - id: detect-private-key
        name: Detect private keys
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=500']

      # File format validation (fast)
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^lib/doctrans_web/live/.*\.ex$  # Exclude LiveView files (contain HEEx, formatter handles them)
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: \.(ex|exs|heex)$  # Exclude Elixir files (formatter handles them)
      - id: check-yaml
        name: Validate YAML files
        exclude: ^\.github/workflows/  # GitHub Actions YAML can have template syntax
      - id: check-json
        name: Validate JSON files
        exclude: tsconfig\.json$  # TypeScript config allows comments
      - id: check-toml
        name: Validate TOML files
      - id: check-xml
        name: Validate XML files

      # Merge conflict markers
      - id: check-merge-conflict
        name: Check for merge conflicts

      # Git checks
      - id: check-case-conflict
        name: Check for case conflicts in filenames
      - id: mixed-line-ending
        name: Check for mixed line endings

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: [--strict, --config-data, '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}']
        exclude: ^\.github/workflows/  # Skip GitHub Actions workflows

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown files

  # GitHub Actions workflow validation
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
        name: Validate GitHub Actions workflows
        args: ["--verbose"]

  # GitHub Actions security audit. This replaced a first-party pin checker: every
  # `uses:` must name a full commit SHA (`unpinned-uses`, hash-pin for all), every
  # checkout must set `persist-credentials: false` (`artipacked`), and the rest of
  # zizmor's offline audits -- template injection, excessive permissions, cache
  # poisoning -- come with it. Every action README shows a floating tag, so the
  # pin regression is a copy-paste away; Dependabot's github-actions ecosystem
  # keeps the pins from going stale. Policy lives in .github/zizmor.yml.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        name: Audit GitHub Actions workflows (zizmor)

  # Elixir hooks
  - repo: local
    hooks:
      # Security audit (fast - runs first for quick feedback on vulnerabilities)
      # Hex 2.5.1+ reports retired packages AND security advisories, exiting
      # non-zero for either. Acknowledged advisories live in the :hex section of
      # mix.exs; Hex warns when an entry stops matching the lockfile.
      - id: hex-audit
        name: Hex security audit (advisories and retirements)
        entry: mix hex.audit
        language: system
        pass_filenames: false
        files: ^(mix\.exs|mix\.lock)$

      # Code formatting check (fast - easy to fix)
      - id: mix-format
        name: Mix format check
        entry: mix format --check-formatted
        language: system
        types: [elixir]
        pass_filenames: false

      # Translation completeness, and no fuzzy entries (fast). Gettext renders
      # fuzzy translations, so one is not a placeholder -- it is wrong text already
      # shipping, auto-filled from a different msgid the merge found similar.
      - id: check-translations
        name: Check translations (complete, none fuzzy)
        entry: mix run --no-start scripts/check_translations.exs
        language: system
        pass_filenames: false
        files: ^(priv/gettext/.*\.pot?|scripts/check_translations\.exs)$

      # Compilation with warnings as errors (medium speed)
      - id: mix-compile
        name: Mix compile with warnings as errors
        entry: mix compile --warnings-as-errors --all-warnings
        language: system
        pass_filenames: false
        files: ^(lib/|test/|config/|mix\.exs)

      # Dependency vulnerability audit
      - id: deps-audit
        name: Dependency vulnerability audit
        entry: mix deps.audit
        language: system
        pass_filenames: false
        files: ^(mix\.exs|mix\.lock)$

      # Toolchain pin agreement. mise.toml is authoritative; CI reads it
      # directly via erlef/setup-beam's `version-file`, but a Docker `FROM` line
      # cannot, so this keeps the restated version in Dockerfile.dev and Dockerfile
      # honest — and keeps every base image in both, the production runtime base
      # included, pinned by digest, since only the digest is immutable.
      - id: check-toolchain-pins
        name: Check toolchain pins match mise.toml
        entry: elixir scripts/check_toolchain_pins.exs
        language: system
        pass_filenames: false
        files: ^(mise\.toml|Dockerfile(\.dev)?|scripts/check_toolchain_pins\.exs)$

      # Pre-commit pin agreement: every remote `rev:` above is a frozen commit SHA
      # (see the header) and every workflow `pip install` passes `--require-hashes`,
      # so the `pre-commit` tool CI runs is the one the hashed requirements file names.
      - id: check-precommit-pins
        name: Check pre-commit hook pins are frozen
        entry: elixir scripts/check_precommit_pins.exs
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/.*|scripts/check_precommit_pins\.exs)$

      # Command-policy regression suite. scripts/command-policy.sh is the one
      # copy of the rule table every agent runs, and this is the only thing that
      # proves a rule change still blocks what it should and nothing else: it drives
      # the matcher, the pi adapter, and -- where the CLI is installed -- the codex
      # rules against the cases in the test script. Needs bash, jq, git and node.
      - id: test-command-policy
        name: Test the agent command policy
        entry: scripts/test-command-policy.sh
        language: script
        pass_filenames: false
        files: ^(scripts/((test-)?command-policy\.sh|pi-adapter\.test\.mjs|fixtures/)|\.(pi/extensions|codex)/)

      # Module size limit. This line is the only place the number is stated:
      # the script requires --max-lines and has no default, so a caller cannot
      # disagree with a default it cannot see. 500 is the value the script documented
      # from the start; the 600 override was added inside a feature PR to let that
      # feature land, which is how the rule came to have two numbers. Line count is a
      # weak proxy for complexity — Credo measures that directly at its own
      # defaults — but it is the only check that sees a module accumulating
      # several simple responsibilities, so it stays blocking.
      - id: check-module-size
        name: Check module size limits (500 lines)
        entry: elixir scripts/check_module_size.exs --max-lines 500
        language: system
        pass_filenames: false
        files: ^(lib/.*\.ex|scripts/check_module_size\.exs)$

      # Compile-time dependency cycles. Architectural enforcement was assessed
      # and Boundary rejected: the violations it would catch do not
      # exist here, and it is an unmaintained compiler-tracer dependency with no
      # upper version bound. `mix xref` ships with Elixir, so it adds no
      # compatibility surface. A compile-connected cycle means a change to any
      # module in it recompiles all of them, and it is how one accidental
      # compile-time call spreads -- a module attribute reading another module's
      # function is enough. The baseline is zero and must stay zero.
      - id: xref-cycles
        name: Check for compile-time dependency cycles
        entry: mix xref graph --format cycles --label compile-connected --fail-above 0
        language: system
        pass_filenames: false
        # test/support is on elixirc_paths under MIX_ENV=test, so it feeds the graph too.
        files: ^(lib/|test/support/|mix\.exs$)

      # Cross-context runtime cycles. The gate above ignores runtime edges, which is
      # how `Documents` came to depend on `Processing.Run` for its basic writes
      # (#203) without anything failing. Three cycles are expected: the web layer
      # (router, layouts and the LiveViews reference each other by design), the
      # job workers and the processors that enqueue them, and the three schemas
      # that name each other in associations. A fourth means a context has
      # started leaning on a layer above it: break it, do not raise the bound.
      - id: xref-runtime-cycles
        name: Check for cross-context dependency cycles
        entry: mix xref graph --format cycles --fail-above 3
        language: system
        pass_filenames: false
        files: ^(lib/|test/support/|mix\.exs$)

      # Asset bundle build. Nothing else in the gate compiles `assets/`: a syntax
      # error in app.js or theme.js, an import that resolves to nothing, or a stylesheet
      # `@import` naming a file that is not there all survive every check above and first
      # surface at `mix phx.server`, which is to say in a browser rather than in the gate.
      # `js/theme.js` is loaded render-blocking so the stored theme is applied before
      # first paint, which makes a bundle that failed to build a 404 that stalls the parser
      # rather than a deferred script quietly doing nothing. It has to sit after
      # `mix-compile`: app.js imports the colocated hooks, which only exist under
      # `_build/<env>` — the directory config.exs puts on NODE_PATH — once the app has
      # compiled in this MIX_ENV. And `assets.setup` has to precede the build, on every run
      # including a cache hit, because `mix esbuild` only checks that the binary file
      # exists; a stale binary from an earlier pin is used with nothing but a warning, and
      # only `esbuild.install --if-missing` compares the installed `--version` against the
      # configured one. It must also stay ahead of `mix-test-coverage`, which asserts the
      # emitted bundles are served.
      - id: assets-build
        name: Build asset bundles (esbuild, Tailwind)
        entry: mix do assets.setup + assets.build
        language: system
        pass_filenames: false
        files: ^(assets/|config/config\.exs|mix\.exs$)

      # Static code analysis with Credo (medium speed)
      - id: credo
        name: Credo strict mode
        entry: mix credo --strict
        language: system
        pass_filenames: false
        files: ^(lib/|test/).*\.ex$

      # Security-focused static analysis (medium speed).
      # .sobelow-conf sets exit: "low", so every confidence level blocks. Known-good
      # sites carry a `# sobelow_skip` annotation and a justification on the function
      # that owns the call; a new finding fails here instead of printing as noise.
      - id: sobelow
        name: Sobelow security analysis
        entry: mix sobelow --config
        language: system
        pass_filenames: false
        files: ^(lib/|config/)

      # raw/1 call-site register. The HTML sanitizer is the first layer in front of
      # LLM-extracted upload content and the CSP the second; this pins the one site
      # that depends on the sanitizer.
      - id: check-raw-call-sites
        name: Check raw/1 call sites
        entry: elixir scripts/check_raw_call_sites.exs
        language: system
        pass_filenames: false
        files: ^(lib/.*\.(ex|exs|heex)|scripts/check_raw_call_sites\.exs)$

      # OpenAI client call-site register. Every call into the model API goes
      # through `Deps.openai/0`, the seam tests replace with `OpenAIMock`; a module
      # that names `Doctrans.Processing.OpenAI` directly drags its tests back onto a
      # real HTTP server, a global env override and a fuse reset (#193, #207).
      - id: check-openai-call-sites
        name: Check OpenAI client call sites
        entry: elixir scripts/check_openai_call_sites.exs
        language: system
        pass_filenames: false
        files: ^(lib/.*\.(ex|exs|heex)|scripts/check_openai_call_sites\.exs)$

      # Dialyzer suppression register. Narrow `{file, class, line}` keys, an
      # owner, an expiry, an upstream link, and a rationale per entry, capped at 8.
      # `always_run` because the expiry is a date, not a file change: a register nobody
      # touches is exactly the one that goes stale.
      - id: check-dialyzer-filters
        name: Check Dialyzer suppression register
        entry: elixir scripts/check_dialyzer_filters.exs
        language: system
        pass_filenames: false
        always_run: true

      # Static type analysis. --list-unused-filters makes a stale entry in
      # .dialyzer_ignore.exs fail the gate instead of lingering unnoticed.
      - id: dialyzer
        name: Dialyzer type analysis
        entry: env MIX_ENV=test mix dialyzer --format dialyxir --list-unused-filters
        language: system
        pass_filenames: false
        files: ^(lib/|test/support/|mix\.exs|mix\.lock|\.dialyzer_ignore\.exs)$

      # Test suite with coverage (slow - runs last)
      - id: mix-test-coverage
        name: Mix test with 80% coverage
        entry: mix test --cover
        language: system
        pass_filenames: false
        files: ^(lib/|test/|config/|mix\.exs$|mix\.lock$|coveralls\.json$)

      # Clean up unused dependencies (fast cleanup task)
      - id: mix-deps-unlock
        name: Unlock unused dependencies
        entry: mix deps.unlock --unused
        language: system
        pass_filenames: false
        files: ^mix\.lock$

# Configuration for pre-commit.ci (if using the service). Its weekly autoupdate
# must keep the `rev:` pins frozen; `check-precommit-pins` fails any PR it opens
# that carries a bare tag.
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
