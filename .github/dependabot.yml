# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The ecosystem identifier for Elixir/Hex is "mix" (the manifest is mix.exs).
  # "hex" is not a valid value and is silently ignored.
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      mix-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keeps SHA-pinned workflow actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the digest-pinned base images in `Dockerfile.dev` and `Dockerfile`
  # current — a digest pin that nothing bumps only trades a mutable tag for a
  # frozen, ageing image. The fetcher matches any filename containing
  # "dockerfile", so both are picked up without naming either, and it rewrites
  # the tag and the digest together. That covers the production runtime's Debian
  # base as well as the Elixir builder.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
