services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doctrans_dev
    volumes:
      - pgdata:/var/lib/postgresql
    # Bind to loopback only: Doctrans is a local, single-user app with no
    # authentication, so the database should not be reachable from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # The image's user takes these ids (see Dockerfile.dev). Export UID and
      # GID -- `UID=$(id -u) GID=$(id -g) docker compose up` -- on a Linux host
      # whose account is not 1000:1000, so the files the watchers write into
      # the bind mount are yours. Docker Desktop maps ownership on its own.
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Stated here as well as in the image, from the same variables, so the
    # container never runs as root even if the Dockerfile's USER line goes.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # config/dev.exs reads only the host; credentials and the database name
      # are fixed there, and DATABASE_URL is a release-only setting.
      DATABASE_HOST: db
      OPENAI_HOST: http://host.docker.internal:8000
      PHX_HOST: localhost
      PORT: 4000
      # Bind on all interfaces *inside the container*; the published port below
      # is what actually limits reachability to this machine. Without this the
      # endpoint would listen on the container's loopback only, where nothing
      # outside the container — the port publication included — can reach it.
      PHX_BIND_IP: "0.0.0.0"
      # The storage root is the named volume below, not `priv/static/uploads`
      # on the bind mount: the uploaded document and the converters' `--outdir`
      # stay off the checkout, so a LibreOffice or poppler bug triggered by a
      # hostile document does not start out inside a tree the code reloader
      # compiles and `git checkout` runs hooks from. The image owns this path.
      DOCTRANS_DATA_DIR: /var/lib/doctrans
    # Bind to loopback only: Doctrans is a local, single-user app with no
    # authentication, so it is not exposed to the LAN by default.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent overwriting dependencies
      - /app/deps
      - /app/_build
      # Shadow the two trees that turn a write into execution on the *host*:
      # `.git/hooks` run on the developer's next checkout, and `scripts/` holds
      # the command policy every agent runs. Nothing in the container writes
      # to either, so they are mounted read-only over the source mount.
      - ./.git:/app/.git:ro
      - ./scripts:/app/scripts:ro
      # Documents, page images and converted PDFs; see DOCTRANS_DATA_DIR above.
      - data:/var/lib/doctrans
    # Converters get a private, memory-backed /tmp rather than the container's
    # writable layer.
    tmpfs:
      - /tmp
    # Nothing here needs a capability or a setuid step: the app, Mix, the
    # watchers and the converters all run as the unprivileged user above.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    # Allow access to the host machine's OpenAI-compatible server (oMLX)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  pgdata:
  # Resolves to `doctrans_data` under Compose's project prefix -- distinct from
  # the runtime stack's `doctrans_runtime_data`.
  data:
