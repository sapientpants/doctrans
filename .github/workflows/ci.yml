name: CI
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A new advisory can affect an unchanged lockfile, so re-audit on a schedule.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A push that supersedes an earlier push to the same ref makes the earlier run's
# verdict irrelevant, so cancel it rather than pay for a full 30-minute job. The
# group includes `github.event_name` as well as the ref because a pull request and
# a push to `main` report different refs but a schedule run and a `main` push do
# not, and a weekly advisory re-audit must not cancel — or be cancelled by — an
# unrelated push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Run Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctrans_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      MIX_ENV: test

    steps:
      # Actions are pinned to a full commit SHA: a mutable major tag like `@v7` can
      # be repointed at any commit by anyone who can push to that repository, and this
      # job downloads and executes hook code from five external repositories on top
      # of that. The trailing comment records the human-readable version, which is
      # what Dependabot's `github-actions` ecosystem reads and bumps.
      #
      # `persist-credentials: false` stops checkout leaving the job's GITHUB_TOKEN
      # behind for later steps to read — including the third-party action and hook
      # code above. Since v6 the token is written to a credentials file under
      # RUNNER_TEMP that `.git/config` includes, rather than to `.git/config`
      # itself; that moves it out of the repository but not out of reach of a step
      # running in the same job. Nothing here pushes or calls the API — the
      # remaining git commands are local (`git status`, `git diff`).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `mise.toml` is the single source of truth for the toolchain. Reading it
      # here rather than restating the versions keeps CI, Docker, and local
      # tooling from drifting, and avoids a `strategy.matrix`, which would
      # interpolate the versions into the job name and detach the branch
      # ruleset from the required check on every bump.
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Set up Python for pre-commit
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Restore Dialyzer PLT cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v2-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-v2-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # The asset toolchain is two downloaded executables, and the cache key below has to
      # name their versions. This step reads them out of the source of truth rather than
      # restating them here, the same way `setup-beam` above reads `mise.toml` instead of
      # carrying its own copy of the Erlang and Elixir versions: a bump then moves the key
      # on its own, and there is no second place to forget. It has to be a read of
      # `config/config.exs` specifically — the versions of the *binaries* live there, not in
      # `mix.lock`, where `{:esbuild, "~> 0.10"}` pins only the Mix task that downloads them.
      # Hashing the lockfile would miss every binary bump and react to every unrelated one.
      # An empty capture means the config was reshaped and the awk no longer matches, which
      # would otherwise degrade into a key of `-assets-esbuild--tailwind-` shared by every
      # future run, so it fails the job loudly instead. Each scan is confined to its own
      # block — the flag is cleared by the next top-level `config ` line rather than left
      # set — because otherwise a version moved onto its `config :esbuild,` line would let
      # the scan run on and report Tailwind's version as esbuild's: a wrong key that looks
      # entirely plausible, which the empty-capture guard above would never catch.
      - name: Read asset toolchain versions
        id: assets
        run: |
          esbuild=$(awk '/^config / {f = ($0 ~ /^config :esbuild,/)} f && /^  version:/ {gsub(/[^0-9.]/, "", $2); print $2; exit}' config/config.exs)
          tailwind=$(awk '/^config / {f = ($0 ~ /^config :tailwind,/)} f && /^  version:/ {gsub(/[^0-9.]/, "", $2); print $2; exit}' config/config.exs)
          if [[ -z "$esbuild" || -z "$tailwind" ]]; then
            echo "Could not read the esbuild/tailwind versions from config/config.exs"
            exit 1
          fi
          echo "esbuild=$esbuild" >> "$GITHUB_OUTPUT"
          echo "tailwind=$tailwind" >> "$GITHUB_OUTPUT"

      # Both binaries install to `_build/esbuild-<target>` and `_build/tailwind-<target>-<version>`
      # — the parent of the per-environment build directory, so they are MIX_ENV-independent
      # and already sit inside the `deps`/`_build` cache restored above. That is not enough on
      # its own: that cache is keyed on `mix.lock` and, deliberately, saved only `if: success()`,
      # so a run that goes red leaves the roughly 86 MB toolchain unsaved and the retry pays the
      # download a second time — exactly when a job is already being re-run. This pair is keyed
      # on the two versions themselves and saved as soon as the download succeeds, below.
      #
      # There are deliberately no `restore-keys`. A prefix match is the right behaviour for the
      # caches above, where a stale `_build` is merely recompiled, but here it would restore a
      # binary of the wrong version — and `mix esbuild` would then run it without complaint.
      - name: Restore asset toolchain cache
        id: assets-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/esbuild-*
            _build/tailwind-*
          key: ${{ runner.os }}-assets-esbuild-${{ steps.assets.outputs.esbuild }}-tailwind-${{ steps.assets.outputs.tailwind }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile dependencies
        run: mix deps.compile

      # This runs on every job, cache hit included, because `mix esbuild` — the task that
      # actually builds the bundles — only checks that the binary file exists. A restored
      # executable left over from an earlier pin is used regardless, with nothing but a
      # `Logger.warning` to say so, and the gate would then be testing a build the app no
      # longer performs. Only `esbuild.install --if-missing` asks the installed binary for
      # its own `--version` and replaces it when it disagrees with the configured one. With
      # the pinned binaries already on disk the step costs about a second and makes no
      # network request at all, so running it unconditionally buys that guarantee for free.
      #
      # It is also the one step in this job that can reach a third party at all, which is
      # why Q08 weighed it before adding it to a workflow that pins every `uses:` to a
      # commit SHA. The two halves are not equally protected: esbuild comes from
      # registry.npmjs.org with its npm signature verified against pinned public keys and a
      # sha512 integrity check over the tarball, while Tailwind is a plain GitHub release
      # download over verify_peer TLS with no checksum and no signature. For Tailwind, the
      # pinned version and the TLS certificate are the whole of the assurance — weaker than
      # what the SHA pins above give us, and worth knowing rather than assuming.
      - name: Install asset toolchain
        run: mix assets.setup

      # Saved here rather than at the end of the job with the other caches: unlike `_build`,
      # a downloaded toolchain is valid whether or not the checks that follow it pass, so
      # there is no reason to make the next run re-fetch it just because this one went red.
      - name: Save asset toolchain cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.assets-cache.outputs.cache-hit != 'true'
        with:
          path: |
            _build/esbuild-*
            _build/tailwind-*
          key: ${{ runner.os }}-assets-esbuild-${{ steps.assets.outputs.esbuild }}-tailwind-${{ steps.assets.outputs.tailwind }}

      - name: Build Dialyzer PLT
        run: mix dialyzer --plt

      - name: Run pre-commit hooks
        env:
          # Coverage runs unconditionally in its own step below.
          SKIP: mix-test-coverage
        run: pre-commit run --all-files

      - name: Test with 80% coverage gate
        run: mix test --cover

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Uncommitted changes detected after precommit:"
            git diff
            echo ""
            echo "Please run 'mix precommit' locally and commit any changes."
            exit 1
          fi

      # Only a run that finished every check has a `_build` worth keeping: a job
      # that failed mid-compile can leave partially written artifacts, and this
      # key is the one every later run restores from. The PLT cache below keeps
      # `if: always()` on purpose — it is written by its own `mix dialyzer --plt`
      # step, which either succeeds before the checks run or fails the job outright.
      - name: Save dependencies cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success()
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Save Dialyzer PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v2-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The single check required by the `main` ruleset. Requiring this stable name
  # instead of each job's own name keeps the requirement attached when jobs are
  # added, renamed, or re-pinned. `if: always()` is required so the job still
  # runs — and fails — when a dependency fails, is cancelled, or is skipped.
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [verify, docker]
    if: always()

    steps:
      - name: Check required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not succeed: $failed"
            exit 1
          fi
