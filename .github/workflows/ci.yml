name: CI
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A new advisory can affect an unchanged lockfile, so re-audit on a schedule.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A push that supersedes an earlier push to the same ref makes the earlier run's
# verdict irrelevant, so cancel it rather than pay for a full 30-minute job. The
# group includes `github.event_name` as well as the ref because a pull request and
# a push to `main` report different refs but a schedule run and a `main` push do
# not, and a weekly advisory re-audit must not cancel — or be cancelled by — an
# unrelated push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Run Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctrans_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      MIX_ENV: test

    steps:
      # Actions are pinned to a full commit SHA: a mutable major tag like `@v7` can
      # be repointed at any commit by anyone who can push to that repository, and this
      # job downloads and executes hook code from five external repositories on top
      # of that. The trailing comment records the human-readable version, which is
      # what Dependabot's `github-actions` ecosystem reads and bumps.
      #
      # `persist-credentials: false` stops checkout leaving the job's GITHUB_TOKEN
      # behind for later steps to read — including the third-party action and hook
      # code above. Since v6 the token is written to a credentials file under
      # RUNNER_TEMP that `.git/config` includes, rather than to `.git/config`
      # itself; that moves it out of the repository but not out of reach of a step
      # running in the same job. Nothing here pushes or calls the API — the
      # remaining git commands are local (`git status`, `git diff`).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `mise.toml` is the single source of truth for the toolchain. Reading it
      # here rather than restating the versions keeps CI, Docker, and local
      # tooling from drifting, and avoids a `strategy.matrix`, which would
      # interpolate the versions into the job name and detach the branch
      # ruleset from the required check on every bump.
      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Set up Python for pre-commit
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Restore Dialyzer PLT cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v2-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-v2-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build Dialyzer PLT
        run: mix dialyzer --plt

      - name: Run pre-commit hooks
        env:
          # Coverage runs unconditionally in its own step below.
          SKIP: mix-test-coverage
        run: pre-commit run --all-files

      - name: Test with 80% coverage gate
        run: mix test --cover

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Uncommitted changes detected after precommit:"
            git diff
            echo ""
            echo "Please run 'mix precommit' locally and commit any changes."
            exit 1
          fi

      # Only a run that finished every check has a `_build` worth keeping: a job
      # that failed mid-compile can leave partially written artifacts, and this
      # key is the one every later run restores from. The PLT cache below keeps
      # `if: always()` on purpose — it is written by its own `mix dialyzer --plt`
      # step, which either succeeds before the checks run or fails the job outright.
      - name: Save dependencies cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success()
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Save Dialyzer PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v2-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The single check required by the `main` ruleset. Requiring this stable name
  # instead of each job's own name keeps the requirement attached when jobs are
  # added, renamed, or re-pinned. `if: always()` is required so the job still
  # runs — and fails — when a dependency fails, is cancelled, or is skipped.
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [verify, docker]
    if: always()

    steps:
      - name: Check required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<< "$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not succeed: $failed"
            exit 1
          fi
